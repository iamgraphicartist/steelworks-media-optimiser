name: Build installers

# Runs the tests and builds:
#   • Windows installer (.exe, ffmpeg bundled)
#   • macOS .dmg for Apple silicon (arm64) and Intel (x86_64), ffmpeg bundled when a static build is available
#   • the Figma plugin zip
# Pushing a tag like v1.0.0 also publishes them as a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-14          # Apple silicon
            arch: arm64
          - os: macos-15-intel    # Intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # ---------- Windows
      - name: ffmpeg + Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg innosetup -y --no-progress
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          $bin = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Recurse -Filter ffmpeg.exe | Where-Object { $_.DirectoryName -like '*\bin' } | Select-Object -First 1
          Copy-Item (Join-Path $bin.DirectoryName 'ffmpeg.exe'), (Join-Path $bin.DirectoryName 'ffprobe.exe') vendor/ffmpeg/

      # ---------- macOS
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg   # used by the tests
          # Self-contained static builds to bundle in the .app (best effort; without them the app uses Homebrew's ffmpeg)
          mkdir -p vendor/ffmpeg
          A=$([ "${{ matrix.arch }}" = "arm64" ] && echo arm64 || echo amd64)
          for t in ffmpeg ffprobe; do
            curl -fsSL -o "/tmp/$t.zip" "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$A/release/$t.zip" \
              && unzip -o -q "/tmp/$t.zip" -d vendor/ffmpeg || echo "no static $t available"
          done
          chmod +x vendor/ffmpeg/* 2>/dev/null || true
          ls -la vendor/ffmpeg || true

      - name: Build
        env:
          SMO_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          SMO_NOTARY_PROFILE: ${{ secrets.MAC_NOTARY_PROFILE }}
          SMO_TARGET_ARCH: ${{ runner.os == 'macOS' && matrix.arch || '' }}
          # Optional: set these as repository *variables* (Settings › Secrets and variables › Actions › Variables)
          # so every installer comes ready to sign in. They are public app IDs, not secrets.
          SMO_DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
          SMO_FIGMA_CLIENT_ID: ${{ vars.FIGMA_CLIENT_ID }}
        run: python scripts/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.exe
            out/*.dmg
            out/*.zip
          fail_on_unmatched_files: false
          body: |
            ## Download
            * **Windows 10/11**: `Steelworks-Media-Optimiser-…-Windows-Setup.exe`
            * **Mac with Apple silicon (M1–M4)**: `…-macOS-arm64.dmg`
            * **Intel Mac**: `…-macOS-x86_64.dmg`
            * **Figma plugin**: `…-Figma-Plugin-….zip` (unzip, then in Figma choose Plugins › Development › Import plugin from manifest)

            The Mac app isn't signed by Apple yet: the first time, right-click it in Applications, choose **Open**, then **Open** again.
            See the [user guide](https://github.com/${{ github.repository }}/blob/main/docs/USER_GUIDE.md).
