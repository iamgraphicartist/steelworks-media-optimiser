name: Build installers

# Runs the tests and builds:
#   • Windows installer (.exe, ffmpeg bundled)
#   • macOS .dmg for Apple silicon (arm64) and Intel (x86_64), ffmpeg bundled when a static build is available
#   • the Figma plugin zip
# Pushing a tag like v1.0.0 also publishes them as a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            required: true
          - os: macos-latest      # Apple silicon (bonus: GitHub's arm64 Macs are often short of capacity;
            arch: arm64           #  the Intel build runs on every Mac through Rosetta)
            required: false
          - os: macos-15-intel    # Intel: runs on every Mac
            arch: x86_64
            required: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # ---------- Windows
      - name: ffmpeg + Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Chocolatey has short outages (503s), so retry, and fetch ffmpeg directly if it stays down.
          function Install-Choco($pkg) {
            for ($i = 1; $i -le 4; $i++) {
              choco install $pkg -y --no-progress
              if ($LASTEXITCODE -eq 0) { return $true }
              Write-Host "choco $pkg failed (attempt $i), retrying in 30s"; Start-Sleep 30
            }
            return $false
          }
          if (-not (Install-Choco innosetup)) { throw "Inno Setup could not be installed" }
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          if (Install-Choco ffmpeg) {
            $bin = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Recurse -Filter ffmpeg.exe | Where-Object { $_.DirectoryName -like '*\bin' } | Select-Object -First 1
            $dir = $bin.DirectoryName
          } else {
            Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
            Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" "$env:RUNNER_TEMP\ffmpeg"
            $dir = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          }
          Copy-Item (Join-Path $dir 'ffmpeg.exe'), (Join-Path $dir 'ffprobe.exe') vendor/ffmpeg/
          $global:LASTEXITCODE = 0

      # ---------- macOS
      - name: ffmpeg (macOS) - bundled, so nobody installs anything
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg   # used by the tests
          mkdir -p vendor/ffmpeg
          A=$([ "${{ matrix.arch }}" = "arm64" ] && echo arm64 || echo amd64)
          for t in ffmpeg ffprobe; do
            for i in 1 2 3; do
              curl -fsSL -o "/tmp/$t.zip" "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$A/release/$t.zip" && break
              sleep 10
            done
            unzip -o -q "/tmp/$t.zip" -d vendor/ffmpeg
          done
          chmod +x vendor/ffmpeg/*
          # Must be self-contained and actually run on this Mac, or no release is made.
          for t in ffmpeg ffprobe; do
            vendor/ffmpeg/$t -version | head -1
            if otool -L vendor/ffmpeg/$t | grep -E "/opt/homebrew|/usr/local/(Cellar|opt|lib)"; then
              echo "::error::$t depends on Homebrew libraries"; exit 1
            fi
          done
          file vendor/ffmpeg/ffmpeg

      - name: Build
        env:
          SMO_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          SMO_NOTARY_PROFILE: ${{ secrets.MAC_NOTARY_PROFILE }}
          SMO_TARGET_ARCH: ${{ runner.os == 'macOS' && matrix.arch || '' }}
          SMO_STRICT_JS_TESTS: ${{ runner.os == 'Windows' && '1' || '' }}
          # Optional: set these as repository *variables* (Settings › Secrets and variables › Actions › Variables)
          # so every installer comes ready to sign in. They are public app IDs, not secrets.
          SMO_DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
          SMO_FIGMA_CLIENT_ID: ${{ vars.FIGMA_CLIENT_ID }}
        run: python scripts/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip

  release:
    # Publish whatever was built, as long as the required builds (Windows + Intel Mac) succeeded.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Check the required installers are there
        run: |
          ls -la out
          ls out/*Windows-Setup.exe out/*macOS-x86_64.dmg
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.exe
            out/*.dmg
            out/*.zip
          fail_on_unmatched_files: false
          body: |
            ## Download
            * **Windows 10/11**: `Steelworks-Media-Optimiser-…-Windows-Setup.exe`
            * **Any Mac**: `…-macOS-x86_64.dmg` (on M1–M4 Macs it runs through Rosetta; macOS offers to install it the first time)
            * **Mac with Apple silicon, native**: `…-macOS-arm64.dmg`, when included
            * **Figma plugin**: `…-Figma-Plugin-….zip` (unzip, then in Figma choose Plugins › Development › Import plugin from manifest)

            The Mac app isn't signed by Apple yet: the first time, right-click it in Applications, choose **Open**, then **Open** again.
            See the [user guide](https://github.com/${{ github.repository }}/blob/main/docs/USER_GUIDE.md).
